server:
  port: 8085

spring:
  application:
    name: order-service
  task:
    scheduling:
      # O TaskScheduler padrão do Boot roda com UMA thread para todos os @Scheduled do contexto.
      # Aqui há dois jobs (OutboxRelayJob a cada 1s e SagaTimeoutJob a cada 10s): com SQS lento, um
      # lote do relay (até 20 eventos x apiCallAttemptTimeout) atrasaria o job de timeout e
      # enfraqueceria a garantia "pedido nunca preso". Duas threads evitam que um serialize o outro
      # (WR-04); cada job continua sem sobreposição consigo mesmo (fixedDelay).
      pool-size: 2
  datasource:
    # D-01: instância Postgres única, um schema por serviço — currentSchema=order isola este
    # serviço das tabelas de auth/catalog/inventory.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow?currentSchema=order}
    username: ${SPRING_DATASOURCE_USERNAME:orderflow}
    password: ${SPRING_DATASOURCE_PASSWORD:orderflow}
  flyway:
    schemas: order
    default-schema: order
    create-schemas: true
  jpa:
    # O Flyway é dono do schema; o Hibernate só valida que o mapeamento bate com o schema real —
    # nunca gera DDL sozinho.
    hibernate:
      ddl-auto: validate
    # A entidade nunca sai do serviço transacional — o DTO de resposta é montado dentro da
    # transação (OrderService), então a sessão do Hibernate não precisa sobreviver até a
    # serialização da view.
    open-in-view: false
    properties:
      hibernate:
        # "order" é palavra reservada do SQL: sem as aspas duplas dentro das aspas simples do
        # YAML, o Hibernate gera "order.orders" sem qualificação, e o PostgreSQL rejeita com erro
        # de sintaxe. Flyway e o parâmetro currentSchema do JDBC acima tratam o nome do schema
        # como texto simples e não precisam desta forma entre aspas.
        default_schema: '"order"'
  security:
    oauth2:
      resourceserver:
        jwt:
          # order-service é apenas resource server — nunca emite token. A validação é local por
          # chave pública buscada uma vez do JWKS do auth-service (D-03 herdado da Fase 1).
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          # Com jwk-set-uri também definido, o Boot NÃO faz descoberta OIDC: busca as chaves no
          # jwk-set-uri e usa o issuer-uri só como o valor esperado do claim iss. O valor não é
          # uma URL porque o auth-service emite o iss literal orderflow-auth-service, que não
          # depende de host nem de rede — por isso o docker-compose.yml não ganha variável nova.
          # Fecha T-03-02/WR-07: sem esta linha, um token assinado pela chave confiável mas com
          # iss diferente (ou ausente) era aceito, pois só assinatura e exp/nbf eram validados.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:orderflow-auth-service}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        # Literais fixos, de propósito não ligados às variáveis AWS_* do ambiente do
        # desenvolvedor — mesmo motivo já registrado em inventory-service/notification-service.
        access-key: test
        secret-key: test
      endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://localhost:4566}
      sqs:
        # O padrão do Spring Cloud AWS é criar a fila ausente quando o cliente a procura — isso
        # esconderia um init hook do LocalStack quebrado. "fail" faz o envio falhar alto em vez de
        # mascarar o problema (mesmo motivo do inventory-service).
        queue-not-found-strategy: fail
        listener:
          # [Rule 1 - Bug, mesma lição de 05-02/inventory-service]: o mesmo SqsAsyncClient é
          # compartilhado pelo container do listener e por qualquer outra chamada (relay, testes),
          # e já tem apiCallAttemptTimeout curto (SqsMessagingConfig, D-41, pensado só para o
          # RestClient síncrono não prender a thread HTTP). Long polling padrão do SQS
          # (waitTimeSeconds até 20s) estouraria esse teto a cada ciclo de recebimento do primeiro
          # @SqsListener real deste serviço (ReservationResultListener, 05-03). poll-timeout=0
          # desliga o long polling (ReceiveMessage responde na hora, com ou sem mensagem).
          poll-timeout: 0s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

orderflow:
  messaging:
    # Fila de comandos consumida pelo inventory-service (D-61) — precisa bater exatamente com o
    # nome criado pelo init hook localstack-init/ready.d/02-create-order-saga-resources.sh.
    inventory-commands-queue: inventory-commands-queue
    # Fila do resultado da reserva (StockReserved/StockReservationFailed), consumida por
    # ReservationResultListener (05-03, D-61) — mesmo init hook cria as duas filas.
    order-events-queue: order-events-queue
  outbox:
    # Intervalo do relay @Scheduled do outbox, em milissegundos (D-59, Claude's Discretion). Valor
    # curto nos testes (application-test.yml) para não pagar segundos de espera por teste.
    relay-interval: 1000
    # Tamanho do lote travado por tick do relay (SELECT ... FOR UPDATE SKIP LOCKED).
    batch-size: 20
  saga:
    # Fase 5 (D-63, SAGA_TIMEOUT_DEFAULTS): garantia de código do "nunca preso" — um pedido preso
    # em RESERVING há mais tempo que reservation-timeout é cancelado pelo SagaTimeoutJob, mesmo que
    # o resultado da reserva nunca chegue. timeout-check-interval é o intervalo (ms) entre ciclos do
    # job; timeout-batch-size limita quantos pedidos vencidos são processados por ciclo.
    reservation-timeout: 2m
    timeout-check-interval: 10000
    timeout-batch-size: 50
  clients:
    # O RestClient do Spring não tem timeout padrão — um vizinho travado seguraria a thread para
    # sempre (lição do WR-03 da Fase 3, agora D-41). As URLs são fixas por configuração, nunca
    # derivadas da requisição.
    auth-service:
      base-url: ${ORDERFLOW_AUTH_SERVICE_BASE_URL:http://localhost:8081}
      connect-timeout: 2s
      read-timeout: 3s
    catalog-service:
      base-url: ${ORDERFLOW_CATALOG_SERVICE_BASE_URL:http://localhost:8082}
      connect-timeout: 2s
      read-timeout: 3s
  openapi:
    title: "OrderFlow — Order Service API"
    description: >-
      Criação de pedidos a partir do catálogo, decisão de aprovação por limite de crédito e
      consulta de pedidos por empresa.
