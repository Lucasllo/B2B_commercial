server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    # D-01: instancia Postgres unica, um schema por servico — currentSchema=inventory isola este
    # servico das tabelas de auth/catalog/order.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow?currentSchema=inventory}
    username: ${SPRING_DATASOURCE_USERNAME:orderflow}
    password: ${SPRING_DATASOURCE_PASSWORD:orderflow}
  flyway:
    schemas: inventory
    default-schema: inventory
    create-schemas: true
  jpa:
    # O Flyway e dono do schema; o Hibernate so valida que o mapeamento bate com o schema real —
    # nunca gera DDL sozinho.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
  security:
    oauth2:
      resourceserver:
        jwt:
          # inventory-service e apenas resource server — nunca emite token. A validacao e local
          # por chave publica buscada uma vez do JWKS do auth-service (D-03 herdado da Fase 1).
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          # Com jwk-set-uri tambem definido, o Boot NAO faz descoberta OIDC: busca as chaves no
          # jwk-set-uri e usa o issuer-uri so como o valor esperado do claim iss. O valor nao e
          # uma URL porque o auth-service emite o iss literal orderflow-auth-service, que nao
          # depende de host nem de rede — por isso o docker-compose.yml nao ganha variavel nova.
          # Fecha T-03-02/WR-07: sem esta linha, um token assinado pela chave confiavel mas com
          # iss diferente (ou ausente) era aceito, pois so assinatura e exp/nbf eram validados.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:orderflow-auth-service}
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        # Literais fixos, de proposito nao ligados as variaveis AWS_* do ambiente do
        # desenvolvedor — mesmo motivo registrado no application.yml do notification-service:
        # credencial real nunca chega a este servico, e credencial falsa impede chamada acidental
        # a AWS real se o endpoint local faltar.
        access-key: test
        secret-key: test
      endpoint: ${SPRING_CLOUD_AWS_ENDPOINT:http://localhost:4566}
      sqs:
        # O padrao do Spring Cloud AWS e criar a fila ausente quando o cliente a procura — isso
        # esconderia um init hook do LocalStack quebrado (Success Criteria 4 do ROADMAP). "fail"
        # faz o envio falhar alto em vez de mascarar o problema.
        queue-not-found-strategy: fail

# Nenhuma decisao desta fase pede threads virtuais no lado servidor — a flag de threads virtuais
# do Spring Boot fica deliberadamente ausente deste arquivo (02-RESEARCH.md Pitfall 5 e Open
# Questions item 1). O uso de threads virtuais desta fase e exclusivamente do lado do cliente do
# teste de concorrencia (02-03).

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

orderflow:
  messaging:
    # Fila de fan-out consumida pelo notification-service (03-01) — precisa bater exatamente com o
    # nome criado pelo init hook localstack-init/ready.d/01-create-notification-resources.sh.
    notification-events-queue: notification-events-queue
  openapi:
    title: "OrderFlow — Inventory Service API"
    description: >-
      Quantidade em estoque e reservas idempotentes.
