services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:2026.08.3
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - SERVICES=sqs,dynamodb
      - PERSISTENCE=0
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./localstack-init/ready.d:/etc/localstack/init/ready.d:ro
    # O endpoint padrao de saude do LocalStack (/_localstack/health) responde antes de o init hook
    # terminar de rodar (03-RESEARCH.md Pitfall D) — um healthcheck so de processo deixaria
    # inventory-service e notification-service subirem contra uma fila/tabela ainda inexistente, e
    # o notification-service, configurado com queue-not-found-strategy=fail, cairia na subida. Por
    # isso o healthcheck verifica os proprios recursos criados pelo init hook
    # (localstack-init/ready.d/01-create-notification-resources.sh), nao apenas o processo.
    # Fase 5: healthcheck também confere as duas filas da saga de reserva de estoque (D-61,
    # localstack-init/ready.d/02-create-order-saga-resources.sh) — mesmo motivo das filas da Fase
    # 3 acima: o order-service depende do localstack saudável para não subir contra uma fila ainda
    # inexistente (queue-not-found-strategy=fail faria a subida cair, em vez de mascarar o problema).
    # Fase 6 (D-80): a tabela notification-history passa a ter particao generica entityId; o
    # healthcheck so fica saudavel com esse key-schema, nao com a tabela antiga (particao productId).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal --region us-east-1 sqs get-queue-url --queue-name notification-events-queue > /dev/null && awslocal --region us-east-1 dynamodb describe-table --table-name notification-history --query Table.KeySchema --output text | grep -q entityId && awslocal --region us-east-1 sqs get-queue-url --queue-name inventory-commands-queue > /dev/null && awslocal --region us-east-1 sqs get-queue-url --queue-name order-events-queue > /dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=catalog
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      # A partir da Fase 3 este servico publica na fila apos o commit do ajuste de estoque (03-02);
      # nome de servico do compose, nao localhost (default do application.yml).
      SPRING_CLOUD_AWS_ENDPOINT: http://localstack:4566
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      localstack:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      SPRING_CLOUD_AWS_ENDPOINT: http://localstack:4566
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow?currentSchema=order
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
      # O order-service chama auth-service e catalog-service direto pela rede do compose, nunca
      # pelo Gateway — as URLs abaixo apontam para o nome do serviço, nunca para localhost.
      ORDERFLOW_AUTH_SERVICE_BASE_URL: http://auth-service:8081
      ORDERFLOW_CATALOG_SERVICE_BASE_URL: http://catalog-service:8082
      # Fase 5: o order-service passa a publicar (relay do outbox) e consumir (05-03) mensagens da
      # saga de reserva de estoque — nome de serviço do compose, não localhost (default do
      # application.yml).
      SPRING_CLOUD_AWS_ENDPOINT: http://localstack:4566
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
